<body>
  <!-- Credo Payment Inline JS SDK -->
  <script src="https://pay.credocentral.com/inline.js"></script>
  <script>window.CREDO_PUBLIC_KEY = '1PUB_REPLACE_WITH_YOUR_LIVE_KEY';</script>

  <!-- Header (hidden during auth, shown after login) -->
  <header class="app-header" id="app-header"></header>

  <!-- Main View Container -->
  <main id="main-app-container" role="main">
    <!-- Loading state -->
    <div class="app-loading" id="app-loading">
      <div class="loading-logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
      </div>
      <span>CBT Master</span>
    </div>
  </main>

  <!-- App Bootstrap: compatibility check + conditional module load -->
  <script>
    (function () {
      // Test for optional chaining (ES2020) — Safari < 13.4 / iOS < 14 fails this
      var supported = false;
      try { new Function('return null?.x')(); supported = true; } catch (e) { }

      if (!supported) {
        // Browser too old — show friendly upgrade message, DO NOT load the app module
        var el = document.getElementById('app-loading');
        if (el) el.innerHTML =
          '<div style="max-width:380px;text-align:center;padding:2rem;">' +
          '<div style="font-size:3rem;margin-bottom:1rem;">\uD83D\uDCF1</div>' +
          '<p style="color:#f87171;font-weight:700;font-size:1.1rem;margin-bottom:.75rem;">Browser Update Required</p>' +
          '<p style="color:#94a3b8;font-size:.9rem;line-height:1.6;margin-bottom:1.25rem;">CBT Master uses modern JavaScript (ES2020) not supported by your current browser.</p>' +
          '<p style="color:#64748b;font-size:.85rem;line-height:2;margin-bottom:1.5rem;"><b style="color:#94a3b8;">Supported browsers:</b><br>' +
          'Chrome 85+ &nbsp;|&nbsp; Firefox 74+<br>Safari 14+ &nbsp;|&nbsp; Edge 85+<br>Android Chrome &nbsp;|&nbsp; iOS 14+</p>' +
          '<a href="https://www.google.com/chrome/" style="background:#10b981;color:#fff;text-decoration:none;padding:.65rem 1.5rem;border-radius:8px;font-size:.9rem;display:inline-block;">Get Chrome Free</a>' +
          '</div>';
        return; // Stop — never load the module
      }

      // Browser is compatible — set up error handlers, then inject the app module
      function _showErr(msg) {
        var el = document.getElementById('app-loading');
        if (el) el.innerHTML =
          '<div style="max-width:420px;text-align:center;padding:2rem;">' +
          '<div style="font-size:2.5rem;margin-bottom:1rem;">\u26a0\ufe0f</div>' +
          '<p style="color:#f87171;font-weight:700;font-size:1rem;margin-bottom:.5rem;">Failed to start</p>' +
          '<p style="color:#94a3b8;font-size:.8rem;word-break:break-all;margin-bottom:1.5rem;font-family:monospace;">' + msg + '</p>' +
          '<button onclick="location.reload()" style="background:#10b981;color:#fff;border:none;padding:.6rem 1.5rem;border-radius:8px;cursor:pointer;margin-right:8px;font-weight:600;">Reload</button>' +
          '<button onclick="if(window.caches){caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}))}).then(function(){location.reload(true)});}else{location.reload(true);}" style="background:#334155;color:#94a3b8;border:none;padding:.6rem 1.2rem;border-radius:8px;cursor:pointer;">Clear Cache</button>' +
          '</div>';
      }
      window.addEventListener('error', function (e) {
        var f = e.filename ? e.filename.split('/').pop() + ':' + e.lineno + ' \u2014 ' : '';
        _showErr(f + e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        _showErr('Error: ' + ((r && r.message) ? r.message : String(r || 'unknown')));
      });

      // Dynamically inject the ES module with cache busting
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/app.js?v=20250103b';
      s.onerror = function () {
        _showErr('Failed to load application modules. Please check your network connection and tap Reload.');
      };
      document.head.appendChild(s);
    })();
  </script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          if (reg && reg.update) reg.update();
          console.log('[PWA] ServiceWorker registered:', reg.scope);
        }).catch(function (err) {
          console.log('[PWA] ServiceWorker failed:', err);
        });
      });
    }
  </script>
