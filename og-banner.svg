<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Glowing orb -->
  <circle cx="1020" cy="180" r="140" fill="#10b981" opacity="0.12" filter="blur(40px)"/>

  <!-- Badge -->
  <rect x="100" y="90" width="310" height="42" rx="21" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
  <text x="124" y="117" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#34d399" letter-spacing="1.5">🇳🇬 NIGERIA'S #1 CBT PLATFORM</text>

  <!-- Title -->
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff">
    CBT <tspan fill="url(#brandGrad)">Master</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#f1f5f9">
    JAMB UTME &amp; WAEC WASSCE Practice Portal
  </text>

  <!-- Description paragraph -->
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Authentic Vetted Past Questions • Official 8-Key Navigation • Drag CBT Calculator
  </text>
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Science, Arts &amp; Commercial Combinations • "The Life Changer" Novel Hub
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">🎯 400-Point Target</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="260" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">⚡ Offline-Ready PWA</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="50" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="500" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">📊 Real-Time Analytics</text>
  </g>

  <!-- Domain indicator -->
  <text x="100" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#34d399">
    https://cbtmaster.guru
  </text>
</svg>
